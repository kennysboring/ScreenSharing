[package]
name = "encoder2-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# cros-libva main: builds against libva 2.23+, has packed headers and VPP. Pinned to the commit
# that fixed the libva 2.23 VP9 fields (2026-09-01).
libva = { package = "cros-libva", git = "https://github.com/chromeos/cros-libva", rev = "59384456ac2ae78c0c3e5515f41ef1efd9b802cf" }
# Only for its public SPS/PPS builder and writer (codec::h264); no features, so no libva/GBM
cros-codecs = { version = "0.0.6", default-features = false }
# GBM to allocate the XRGB8888 DMA-BUF the VPP mode imports (Mesa's GBM allocates this format)
gbm-sys = "0.3.1"
