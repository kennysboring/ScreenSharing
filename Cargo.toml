[workspace]
resolver = "3"
members = [
    "crates/signaling-server",
    "crates/streamer-client",
    "crates/common"
]
# Experiments with system dependencies (libpipewire, libva, libclang) stay out of workspace builds
exclude = ["spikes/capture", "spikes/encoder"]

[workspace.dependencies]
common = { path = "crates/common" }
serde = {version = "1", features = ["derive"]}
serde_json = "1"
axum = { version = "0.8.9", features = ["ws"] }
tokio = {version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"]}
uuid = {version = "1.28.0", features = ["v4"]}
futures-util = "0.3.34"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-tungstenite = "0.30.0"
webrtc = "0.21.1"
rtc = "=0.21.1"
async-trait = "0.1.92"
rand = "0.9"
bytes = "1.12.1"
