<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0e0e10;
      color: #f1f1f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    .video-container {
      position: relative;
      width: 100vw;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background-color: #000;
    }
    .status-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      z-index: 10;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #888;
    }
    .status-dot.live {
      background-color: #e53935;
      box-shadow: 0 0 8px rgba(229, 57, 53, 0.8);
    }
    .status-dot.connecting {
      background-color: #fb8c00;
    }
    .status-dot.error {
      background-color: #d32f2f;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      padding: 0 16px;
      width: 100%;
      max-width: 1280px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      background-color: #26262c;
      color: #efeff1;
      border: 1px solid #3a3a44;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px; /* Sized for touch on phones */
      touch-action: manipulation;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover {
      background-color: #32323a;
      border-color: #4e4e5b;
    }
    button:active {
      background-color: #1f1f23;
    }
    @media (max-width: 600px) {
      .video-container {
        width: 100vw;
        border-radius: 0;
      }
      .controls {
        padding: 0 12px;
      }
      button {
        flex: 1;
        font-size: 13px;
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>

  <div class="video-container" id="videoContainer">
    <video id="remoteVideo" autoplay muted playsinline></video>
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">connecting...</span>
    </div>
  </div>

  <div class="controls">
    <button id="unmuteBtn" type="button">Unmute</button>
    <button id="fullscreenBtn" type="button">Fullscreen</button>
  </div>

  <script>
    // WebRTC settings (add TURN servers here in the future)
    const ICE_SERVERS = [
      { urls: 'stun:stun.l.google.com:19302' }
    ];

    // UI elements
    const video = document.getElementById('remoteVideo');
    const videoContainer = document.getElementById('videoContainer');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const unmuteBtn = document.getElementById('unmuteBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    // Connection state
    let ws = null;
    let pc = null;
    let remoteStream = null;
    let iceCandidateQueue = [];
    let isRemoteDescriptionSet = false;
    let reconnectDelay = 1000;
    let reconnectTimeout = null;
    let hasConnectedOnce = false;

    // Take the room_id from the last segment of the pathname
    const pathSegments = window.location.pathname.replace(/\/+$/, '').split('/');
    const roomId = pathSegments[pathSegments.length - 1] || '';

    function updateStatus(text, type) {
      statusText.textContent = text;
      statusDot.className = 'status-dot';
      if (type === 'live') {
        statusDot.classList.add('live');
      } else if (type === 'connecting') {
        statusDot.classList.add('connecting');
      } else if (type === 'error') {
        statusDot.classList.add('error');
      }
    }

    function closePeerConnection() {
      if (pc) {
        pc.onicecandidate = null;
        pc.ontrack = null;
        pc.onconnectionstatechange = null;
        pc.close();
        pc = null;
      }
      remoteStream = null;
      iceCandidateQueue = [];
      isRemoteDescriptionSet = false;
    }

    function resetVideo() {
      video.srcObject = null;
    }

    function createNewPeerConnection() {
      closePeerConnection();

      try {
        pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      } catch (err) {
        updateStatus('failed to create peer connection', 'error');
        return null;
      }

      pc.onicecandidate = (event) => {
        // If event.candidate is null or candidate is an empty string (end of gathering in some browsers), send NOTHING
        if (event.candidate && event.candidate.candidate && event.candidate.candidate.trim() !== '' && ws && ws.readyState === WebSocket.OPEN) {
          const candidateJson = event.candidate.toJSON();
          const message = {
            type: 'signalToHost',
            message: {
              type: 'ice',
              ...candidateJson
            }
          };
          ws.send(JSON.stringify(message));
        }
      };

      pc.ontrack = (event) => {
        // Do not rely on event.streams[0] (avoids issues if the host does not send msid in the SDP)
        if (!remoteStream) {
          remoteStream = new MediaStream();
          video.srcObject = remoteStream;
        }
        if (event.track) {
          remoteStream.addTrack(event.track);
        }
        updateStatus('live', 'live');

        // Try to minimize latency by setting the receiver's jitterBufferTarget, if supported
        // (Note: jitterBufferTarget = 0 asks for minimum latency; on an unstable network 50 to 100 ms can be used)
        if (event.receiver && 'jitterBufferTarget' in event.receiver) {
          try {
            event.receiver.jitterBufferTarget = 0;
          } catch (e) {
            // Ignore if the browser does not support it
          }
        }
      };

      pc.onconnectionstatechange = () => {
        if (!pc) return;
        const state = pc.connectionState;
        if (state === 'connected') {
          updateStatus('live', 'live');
        } else if (state === 'connecting') {
          updateStatus('connecting...', 'connecting');
        } else if (state === 'failed') {
          updateStatus('connection failed', 'error');
        } else if (state === 'disconnected') {
          updateStatus('disconnected', 'error');
        }
      };

      return pc;
    }

    async function handleOffer(offerSdp) {
      const peer = createNewPeerConnection();
      if (!peer) return;

      try {
        await peer.setRemoteDescription(new RTCSessionDescription({
          type: 'offer',
          sdp: offerSdp
        }));
        if (peer !== pc) return; // Guard against racing offers
        isRemoteDescriptionSet = true;

        // Drain and apply the queued ICE candidates
        while (iceCandidateQueue.length > 0) {
          if (peer !== pc) return;
          const candidate = iceCandidateQueue.shift();
          try {
            await peer.addIceCandidate(candidate);
          } catch (e) {
            // Ignore a single candidate failure so the connection does not break
          }
        }

        if (peer !== pc) return;
        const answer = await peer.createAnswer();

        if (peer !== pc) return;
        await peer.setLocalDescription(answer);

        if (peer !== pc) return;
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'signalToHost',
            message: {
              type: 'answer',
              sdp: peer.localDescription.sdp
            }
          }));
        }
      } catch (err) {
        if (peer === pc) {
          updateStatus('WebRTC error', 'error');
        }
      }
    }

    async function handleIceCandidate(candidateData) {
      if (!candidateData || !candidateData.candidate) return;

      const iceInit = {
        candidate: candidateData.candidate,
        sdpMid: candidateData.sdpMid ?? null,
        sdpMLineIndex: candidateData.sdpMLineIndex ?? null,
        usernameFragment: candidateData.usernameFragment ?? null
      };

      if (!isRemoteDescriptionSet || !pc) {
        iceCandidateQueue.push(iceInit);
      } else {
        try {
          await pc.addIceCandidate(iceInit);
        } catch (err) {
          // Ignore a failure on an individual candidate
        }
      }
    }

    function connectWebSocket() {
      if (!roomId) {
        updateStatus('room unavailable', 'error');
        return;
      }

      if (reconnectTimeout) {
        clearTimeout(reconnectTimeout);
        reconnectTimeout = null;
      }

      const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const wsUrl = `${protocol}://${window.location.host}/ws/viewer/${encodeURIComponent(roomId)}`;

      try {
        ws = new WebSocket(wsUrl);
      } catch (e) {
        scheduleReconnect();
        return;
      }

      ws.onopen = () => {
        hasConnectedOnce = true;
        reconnectDelay = 1000; // Reset the wait after a successful connection
        updateStatus('waiting for the host...', 'connecting');
      };

      ws.onmessage = (event) => {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch (err) {
          // Ignore invalid JSON without breaking the page
          return;
        }

        if (!data || typeof data.type !== 'string') {
          return;
        }

        switch (data.type) {
          case 'hostUnavailable':
            closePeerConnection();
            resetVideo();
            updateStatus('waiting for the host...', 'connecting');
            break;

          case 'signalFromHost':
            if (data.message && typeof data.message === 'object') {
              const signal = data.message;
              if (signal.type === 'offer' && signal.sdp) {
                handleOffer(signal.sdp);
              } else if (signal.type === 'ice') {
                handleIceCandidate(signal);
              }
            }
            break;

          default:
            // Unknown type: ignore silently
            break;
        }
      };

      ws.onerror = () => {
        // The browser WebSocket does not expose the HTTP status. If it never connected, show room unavailable
        if (!hasConnectedOnce) {
          updateStatus('room unavailable', 'error');
        }
      };

      ws.onclose = () => {
        closePeerConnection();
        resetVideo();
        if (!hasConnectedOnce) {
          updateStatus('room unavailable', 'error');
        } else {
          updateStatus('connecting...', 'connecting');
        }
        scheduleReconnect();
      };
    }

    function scheduleReconnect() {
      if (reconnectTimeout) return;
      reconnectTimeout = setTimeout(() => {
        reconnectTimeout = null;
        connectWebSocket();
      }, reconnectDelay);

      // Growing wait: 1s, 2s, 4s, 8s, 15s (capped at 15s)
      reconnectDelay = Math.min(reconnectDelay * 2, 15000);
    }

    // Audio button (unmute / mute)
    unmuteBtn.addEventListener('click', () => {
      if (video.muted) {
        video.muted = false;
        video.play().catch(() => {});
        unmuteBtn.textContent = 'Mute';
      } else {
        video.muted = true;
        unmuteBtn.textContent = 'Unmute';
      }
    });

    // Fullscreen button
    fullscreenBtn.addEventListener('click', () => {
      const target = videoContainer;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (target.requestFullscreen) {
          target.requestFullscreen().catch(() => {});
        } else if (target.webkitRequestFullscreen) {
          target.webkitRequestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          // iOS Safari support, directly on the video element
          video.webkitEnterFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    });

    // Start the connection
    updateStatus('connecting...', 'connecting');
    connectWebSocket();
  </script>
</body>
</html>
