[package]
name = "streamer-client"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest  = { workspace = true }
tokio-tungstenite  = { workspace = true }
futures-util  = { workspace = true }
tokio  = { workspace = true }
serde_json  = { workspace = true }
common  = { workspace = true }
axum  = { workspace = true }
serde  = { workspace = true }
webrtc  = { workspace = true }
rtc = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
bytes = { workspace = true }
# VA-API encoder; needs libva headers and libclang to build (see crates/vaapi-encoder)
vaapi-encoder = { path = "../vaapi-encoder", optional = true }

[features]
# `--source vaapi-test`: live H.264 encode of synthetic frames on the GPU (kernel 6.18 only)
vaapi = ["dep:vaapi-encoder", "vaapi-encoder/vaapi"]
